<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #efe4cc;
	background-color: #120e1e;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* The loading screen: the night's colour, one line, and a strip of paper that fills. */
#status {
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: #120e1e;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	visibility: hidden;
	font-family: 'Grenze Gotisch', Georgia, 'Times New Roman', serif;
}

#status-line {
	font-size: 44px;
	letter-spacing: 1px;
	animation: flicker 2.4s steps(1) infinite;
}

#status-bar {
	display: none;
	width: min(420px, 60%);
	height: 14px;
	background: #2a2338;
	transform: rotate(-0.6deg);
	box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
}

#status-fill {
	width: 0;
	height: 100%;
	background: #efe4cc;
}

#status-notice {
	display: none;
	max-width: 70%;
	padding: 1rem 1.5rem;
	background: #efe4cc;
	color: #2b1d1d;
	text-align: center;
	line-height: 1.3;
	font-size: 24px;
	transform: rotate(0.4deg);
}

@keyframes flicker {
	0%, 62%, 70%, 100% { opacity: 1; }
	64%, 72% { opacity: 0.55; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-line">Loading the dark...</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const line = document.getElementById('status-line');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	overlay.style.visibility = 'visible';
	bar.style.display = 'block';

	function fail(err) {
		console.error(err);
		line.style.display = 'none';
		bar.style.display = 'none';
		notice.style.display = 'block';
		notice.textContent = err instanceof Error ? err.message : String(err || 'An unknown error occurred.');
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser cannot run the game. Missing: ' + missing.join(', '));
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			fill.style.width = (current > 0 && total > 0 ? Math.min(100, current / total * 100) : 5) + '%';
		},
	}).then(() => overlay.remove(), fail);
}());
		</script>
	</body>
</html>
